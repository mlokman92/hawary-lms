<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hawary LMS</title>
    <meta
      name="description"
      content="Hawary LMS — the learning management system built for Malaysian academies. Sign up or log in to get started."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: oklch(1 0 0);
        --foreground: oklch(0.141 0.005 285.823);
        --muted: oklch(0.967 0.001 286.375);
        --muted-foreground: oklch(0.552 0.016 285.938);
        --primary: oklch(0.511 0.096 186.391);
        --primary-foreground: oklch(0.984 0.014 180.72);
        --border: oklch(0.92 0.004 286.32);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: oklch(0.141 0.005 285.823);
          --foreground: oklch(0.985 0 0);
          --muted: oklch(0.274 0.006 286.033);
          --muted-foreground: oklch(0.705 0.015 286.067);
          --primary: oklch(0.437 0.078 188.216);
          --primary-foreground: oklch(0.984 0.014 180.72);
          --border: oklch(1 0 0 / 10%);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--muted);
        color: var(--foreground);
        font-family: 'Figtree', system-ui, -apple-system, sans-serif;
        padding: 1.5rem;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 1.75rem;
        max-width: 26rem;
      }

      .wordmark {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .wordmark span {
        color: var(--primary);
      }

      p {
        margin: 0;
        color: var(--muted-foreground);
        font-size: 1.0625rem;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 2.5rem;
        padding: 0 1.5rem;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        border: 1px solid transparent;
        transition:
          opacity 0.15s ease,
          background-color 0.15s ease;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .btn-primary:hover {
        opacity: 0.85;
      }

      .btn-outline {
        background: var(--background);
        color: var(--foreground);
        border-color: var(--border);
      }
      .btn-outline:hover {
        background: var(--muted);
      }
      @media (prefers-color-scheme: dark) {
        .btn-outline {
          background: transparent;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="wordmark">Hawary <span>LMS</span></div>
      <p>
        The learning management system built for Malaysian academies —
        courses, students, assessments and payments in one place.
      </p>
      <div class="actions">
        <a class="btn btn-outline" href="https://app.hawary.my/signin">Log in</a>
        <a class="btn btn-primary" href="https://app.hawary.my/signup">Sign up</a>
      </div>
    </main>
  </body>
</html>
